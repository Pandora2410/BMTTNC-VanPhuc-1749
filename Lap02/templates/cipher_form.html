<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ cipher_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">

        <a href="/" class="btn btn-secondary mb-3">Quay về menu</a>

        <table class="table table-bordered">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">
                    {{ cipher_name }}
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue">ENCRYPTION</td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/{{ cipher_url }}/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text"
                                   class="form-control"
                                   name="plain_text"
                                   placeholder="Input Plain Text"
                                   required autofocus/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text"
                                   class="form-control"
                                   name="key"
                                   placeholder="Input Key"
                                   required/>
                        </div>

                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue">DECRYPTION</td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/{{ cipher_url }}/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text"
                                   class="form-control"
                                   name="cipher_text"
                                   placeholder="Input Cipher Text"
                                   required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="text"
                                   class="form-control"
                                   name="key"
                                   placeholder="Input Key"
                                   required/>
                        </div>

                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>

        {% if result %}
        <div class="alert alert-info">
            <h5>Kết quả</h5>
            <p><b>Input:</b> {{ input_text }}</p>
            <p><b>Key:</b> {{ key }}</p>
            <p><b>Result:</b> {{ result }}</p>
        </div>
        {% endif %}

    </div>
</body>
</html>
