<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transposition Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-4">

        <a href="/" class="btn btn-secondary mb-3">Quay về menu</a>

        <table class="table table-bordered">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">
                    TRANSPOSITION CIPHER
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue">ENCRYPTION</td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/transposition/encrypt">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control"
                                   name="inputPlainText"
                                   placeholder="Input Plain Text" required autofocus/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control"
                                   name="inputKeyPlain"
                                   placeholder="Input Key" required/>
                        </div>

                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue">DECRYPTION</td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/transposition/decrypt">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control"
                                   name="inputCipherText"
                                   placeholder="Input Cipher Text" required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control"
                                   name="inputKeyCipher"
                                   placeholder="Input Key" required/>
                        </div>

                        <button type="submit" class="btn btn-success">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>

        {% if result %}
        <div class="alert alert-info">
            <b>Text:</b> {{ text }} <br>
            <b>Key:</b> {{ key }} <br>
            <b>Result:</b> {{ result }}
        </div>
        {% endif %}

    </div>
</body>
</html>
